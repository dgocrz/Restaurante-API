<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <i class="bi bi-shop text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2">Bienvenido</h2>
        <p class="text-muted">Ingresa a tu panel de administración</p>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label fw-semibold">Correo Electrónico</label>
          <input type="email" class="form-control form-control-lg" placeholder="admin@restaurante.com">
        </div>
        
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control form-control-lg" placeholder="********">
        </div>

        <button type="button" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" (click)="entrar()">
          Iniciar Sesión
        </button>
      </form>

    </div>
  </div>
</div>
